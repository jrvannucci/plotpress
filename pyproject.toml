[build-system]
requires = ["setuptools>=68", "versioningit>=2"]
build-backend = "setuptools.build_meta"

[project]
name = "plotpress"
# Derived from the git tag by versioningit -- see [tool.versioningit] below.
# There is deliberately no version literal here or in plotpress/__init__.py:
# two hand-maintained copies drift, and the tag is the thing a release
# actually is.
dynamic = ["version"]
description = "A fast, figure-centric, SVG-first plotting library with a matplotlib-like API and no global state."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "plotpress contributors" }]
keywords = ["plotting", "svg", "visualization", "matplotlib", "figure"]
# The standard install covers all file output out of the box: SVG, interactive
# HTML, PNG raster, and vector PDF -- pure-wheel deps, installable everywhere.
dependencies = [
    "numpy>=1.21",
    "pillow>=9",        # PNG raster export (fig.save('*.png'))
    "svglib>=1.4",      # PDF export (fig.save('*.pdf'))
    "reportlab>=3.6",   # PDF export
]

[project.optional-dependencies]
# The native fig.show() window needs a desktop webview stack (pythonnet on
# Windows, pyobjc on macOS, system GTK/WebKit on Linux). Keep it optional so the
# standard install stays server/CI/notebook friendly; fig.show() otherwise
# falls back to the browser.
gui = ["pywebview>=4.0"]
# Embed interactive figures in a PyQt/PySide app (plotpress.qt). PySide6 or
# PyQt5+PyQtWebEngine work too; this extra pulls the PyQt6 stack by default.
qt = ["PyQt6>=6.4", "PyQt6-WebEngine>=6.4"]
dev = ["pytest>=7"]
# End-to-end point-picking tests: they drive the interactive HTML's JavaScript
# in a headless browser. After installing, fetch the browser itself with
# `playwright install chromium`.
# pytest>=8.2 for importorskip(reason=...), used to explain the skip.
browser = ["pytest>=8.2", "playwright>=1.40"]
# Benchmarking and cross-library parity: matplotlib for benchmarks/ and the
# comparative perf tests, seaborn for the seaborn checks in
# tests/test_matplotlib_parity.py. Both are importorskip'd, so a plain install
# still runs; this extra makes the cross-library tests reproducible.
bench = ["matplotlib>=3.5", "seaborn>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "perf: timing/benchmark tests (deselect with -m 'not perf')",
    "browser: drives interactive HTML in a headless browser; needs the 'browser' extra plus `playwright install chromium` (select with -m browser)",
]
# Browser tests are opt-in: they need a Chromium download, so a plain `pytest`
# run stays dependency-free. Run them with `pytest -m browser`.
addopts = "-m 'not browser'"

[project.urls]
Homepage = "https://github.com/jrvannucci/plotpress"
Documentation = "https://jrvannucci.github.io/plotpress/"
Changelog = "https://github.com/jrvannucci/plotpress/blob/main/CHANGELOG.md"

# Version comes from the git tag: `git tag -a v0.1.0 -m ...` is the release.
[tool.versioningit]
# Used only when there is no git repository at all -- installing from an sdist
# that predates this config, say. A normal build never reaches it, and a wheel
# carrying this string would be a bug worth noticing.
default-version = "0+unknown"

[tool.versioningit.vcs]
method = "git"
match = ["v*"]
# No tags yet. Until the first `v*` tag exists, builds report 0.0.0 plus the
# commit distance rather than failing, so a fresh clone still installs.
default-tag = "v0.0.0"

[tool.versioningit.format]
# Tagged commit -> "0.1.0". Anything else says so, so a dev build is never
# mistaken for a release on PyPI or in a bug report.
distance = "{base_version}.post{distance}+{rev}"
dirty = "{base_version}+dirty"
distance-dirty = "{base_version}.post{distance}+{rev}.dirty"

# Written at build time so the installed package can report its own version
# without importing setuptools or shelling out to git. Git-ignored: it is a
# build artifact, not source.
[tool.versioningit.write]
file = "plotpress/_version.py"

[tool.setuptools.packages.find]
include = ["plotpress*"]

[tool.setuptools.package-data]
plotpress = ["fonts/*.py"]
