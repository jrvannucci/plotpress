[build-system]
requires = ["setuptools>=68", "versioningit>=2"]
build-backend = "setuptools.build_meta"

[project]
name = "plotpress"
# Derived from the git tag by versioningit -- see [tool.versioningit] below.
# There is deliberately no version literal here or in plotpress/__init__.py:
# two hand-maintained copies drift, and the tag is the thing a release
# actually is.
dynamic = ["version"]
description = "A fast, figure-centric plotting library with a matplotlib-like API, no global state, and one figure exportable to SVG, PNG, PDF, interactive HTML, or Vega/Vega-Lite."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "plotpress contributors" }]
keywords = ["plotting", "svg", "visualization", "matplotlib", "figure"]
# The standard install covers all file output out of the box: SVG, interactive
# HTML, PNG raster, and vector PDF -- pure-wheel deps, installable everywhere.
dependencies = [
    "numpy>=1.21",
    "pillow>=9",        # PNG raster export (fig.save('*.png'))
    "svglib>=1.4",      # PDF export (fig.save('*.pdf'))
    "reportlab>=3.6",   # PDF export
]

[project.optional-dependencies]
# The native fig.show() window needs a desktop webview stack (pythonnet on
# Windows, pyobjc on macOS, system GTK/WebKit on Linux). Keep it optional so the
# standard install stays server/CI/notebook friendly; fig.show() otherwise
# falls back to the browser.
gui = ["pywebview>=4.0"]
# Embed interactive figures in a PyQt/PySide app (plotpress.qt). PySide6 or
# PyQt5+PyQtWebEngine work too; this extra pulls the PyQt6 stack by default.
qt = ["PyQt6>=6.4", "PyQt6-WebEngine>=6.4"]
# fig.show_in_jupyter(): embeds the interactive HTML in an IPython.display
# HTML/iframe, for the notebook-inline toolbar. Any real Jupyter environment
# already has IPython; this extra is for exercising the call outside one.
jupyter = ["ipython>=7"]
# Every way to view/embed a figure outside a static file, bundled for anyone
# who just wants all of them rather than picking one at a time -- each of
# gui/qt/jupyter stays installable on its own too, for anyone who wants only
# one of these (dependency-light) rather than pulling every viewer's stack.
viewers = ["plotpress[gui]", "plotpress[qt]", "plotpress[jupyter]"]

# plotpress.load_data_xarray(): a uniform grid of recovered mesh/line data
# as one labeled xarray.Dataset (row/col dims), instead of load_data()'s
# title-keyed dict of dicts -- xarray pulls in pandas, so it's kept out of
# the standard install the same way every other format-specific extra is.
xarray = ["xarray>=2023.1"]

# Every real end-user feature at once -- everything above except the
# contributor-only tooling below (dev/browser/bench/docs, none of which a
# plotpress *user* has any reason to install). Likely what most people
# reaching for more than the bare install actually want; reach for one of
# viewers/gui/qt/jupyter/xarray directly instead only if the extra weight of
# the others (PyQt6 in particular) matters.
full = ["plotpress[viewers]", "plotpress[xarray]"]

dev = ["pytest>=7"]
# End-to-end point-picking tests: they drive the interactive HTML's JavaScript
# in a headless browser. After installing, fetch the browser itself with
# `playwright install chromium`.
# pytest>=8.2 for importorskip(reason=...), used to explain the skip.
browser = ["pytest>=8.2", "playwright>=1.40"]
# Benchmarking and cross-library parity: matplotlib for benchmarks/ and the
# comparative perf tests, seaborn for the seaborn checks in
# tests/test_matplotlib_parity.py, plotly for benchmarks/'s interactive-HTML
# comparison. All are importorskip'd/has_*()-checked, so a plain install
# still runs; this extra makes the cross-library tests/benchmarks
# reproducible. (xy is not listed: it ships per-platform wheels and is
# simply absent on some machines, so it isn't a normal pip dependency.)
bench = ["matplotlib>=3.5", "seaborn>=0.12", "plotly>=5.0"]
# Building docs/ (`python -m sphinx -b html docs docs/_build/html`): matplotlib
# for the one head-to-head comparison example (importorskip'd there too, but
# the published docs carry the real chart, not the "not installed" fallback);
# polars, adaptive, and xarray (load_data_xarray()'s own gallery example) are
# hard imports in several gallery scripts, not optional. joblib backs
# sphinx-gallery's own parallel example execution
# (`sphinx_gallery_conf["parallel"]` in docs/conf.py, driven by `-j`) --
# gallery scripts share no state to race over (see the top-level "No global
# state" rule), which is what usually keeps projects from turning this on.
docs = [
    "sphinx>=7",
    "sphinx-gallery>=0.15",
    "sphinx-rtd-theme>=2.0",
    "matplotlib>=3.5",
    "polars>=1.0",
    "adaptive>=1.0",
    "joblib>=1.3",
    "xarray>=2023.1",
]
# Everything a contributor needs in one shot: the fast test suite, the
# browser-driven point-picking tests (still needs a separate
# `playwright install chromium`), the cross-library benchmark/parity suite,
# and the docs toolchain -- each of dev/browser/bench/docs stays installable
# on its own too, for CI jobs that only need one of them.
contrib = ["plotpress[dev]", "plotpress[browser]", "plotpress[bench]", "plotpress[docs]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "perf: timing/benchmark tests (deselect with -m 'not perf')",
    "browser: drives interactive HTML in a headless browser; needs the 'browser' extra plus `playwright install chromium` (select with -m browser)",
]
# Browser tests are opt-in: they need a Chromium download, so a plain `pytest`
# run stays dependency-free. Run them with `pytest -m browser`.
addopts = "-m 'not browser'"

[project.urls]
Homepage = "https://github.com/jrvannucci/plotpress"
Documentation = "https://jrvannucci.github.io/plotpress/"
Changelog = "https://github.com/jrvannucci/plotpress/blob/main/CHANGELOG.md"

# Version comes from the git tag: `git tag -a 0.1.0 -m ...` is the release.
[tool.versioningit]
# Used only when there is no git repository at all -- installing from an sdist
# that predates this config, say. A normal build never reaches it, and a wheel
# carrying this string would be a bug worth noticing.
default-version = "0+unknown"

[tool.versioningit.vcs]
method = "git"
match = ["[0-9]*"]
# No tags yet. Until the first bare-version tag exists, builds report 0.0.0
# plus the commit distance rather than failing, so a fresh clone still installs.
default-tag = "0.0.0"

[tool.versioningit.format]
# Tagged commit -> "0.1.0". Anything else says so, so a dev build is never
# mistaken for a release on PyPI or in a bug report.
distance = "{base_version}.post{distance}+{rev}"
dirty = "{base_version}+dirty"
distance-dirty = "{base_version}.post{distance}+{rev}.dirty"

# Written at build time so the installed package can report its own version
# without importing setuptools or shelling out to git. Git-ignored: it is a
# build artifact, not source.
[tool.versioningit.write]
file = "plotpress/_version.py"

[tool.setuptools.packages.find]
include = ["plotpress*"]

[tool.setuptools.package-data]
plotpress = ["fonts/*.py"]
